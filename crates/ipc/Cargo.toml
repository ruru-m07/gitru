[package]
name = "ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = "1.0.225"
serde_json = "1.0.145"
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = [
    "common-controls-v6",
    "compression",
], default-features = false }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
uuid = { version = "1", features = ["v4"] }
logger = { path = "../logger" }
log = "0.4"
git = { path = "../git" }
tokio = { version = "1", features = ["sync"] }
