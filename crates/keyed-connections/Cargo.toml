[package]
name = "gitru-keyed-connections"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
collaboration = { path = "../collaboration", features = ["native-keyed-store"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libsqlite3-sys = { version = "=0.37.0", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "=3.27.0"
log = "0.4"
