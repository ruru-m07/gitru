[package]
name = "gitru"
version = "0.1.0"
description = "A Git Client"
authors = ["ruru"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CEF is the only desktop runtime. The qualification feature keeps this
# worktree on its disposable application identity while the macOS migration is
# proven locally.
default = ["qualification"]
qualification = []
e2e = ["qualification"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.0", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.0", features = [] }
tauri-runtime-cef = { version = "=3.0.0-alpha.0", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
ipc = { path = "../../../crates/ipc" }
git = { path = "../../../crates/git" }
tokio = { version = "1", features = ["full"] }
tauri-plugin-opener = "=3.0.0-alpha.0"
tauri-plugin-process = "=3.0.0-alpha.0"
tauri-plugin-store = "=3.0.0-alpha.0"
tauri-plugin-dialog = { version = "=3.0.0-alpha.0", default-features = false, features = ["xdg-portal"] }
tauri-plugin-window-state = "=3.0.0-alpha.0"
tauri-plugin-updater = "=3.0.0-alpha.0"
serde_json = "1.0.145"
openssl = { version = "0.10.80", features = ["vendored"] } 
tauri-plugin-log = "=3.0.0-alpha.0"
log = "0.4"
url = "2"
