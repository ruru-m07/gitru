[package]
name = "gitru"
version = "0.1.0"
description = "A Git Client"
authors = ["ruru"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = [
] }

[dependencies]
# tauri = { version = "2", features = ["unstable"] }
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef", features = [
    "common-controls-v6",
    "compression",
    "unstable",
], default-features = false }
serde = { version = "1", features = ["derive"] }
ipc = { path = "../../../crates/ipc" }
git = { path = "../../../crates/git" }
tokio = { version = "1", features = ["full"] }
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-process = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-dialog = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-window-state = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-notification = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
serde_json = "1.0.145"
openssl = { version = "0.10.80", features = ["vendored"] }
log = "0.4"
url = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
] }

[features]
default = ["cef"]
cef = ["tauri/cef"]
