name: release-please-beta

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RURU_PAT_GH }}
          config-file: .release-please-beta.json
          manifest-file: .release-please-manifest.json
          target-branch: dev
